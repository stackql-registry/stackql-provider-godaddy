name: build-and-test

# Build the godaddy provider from the pinned GoDaddy Domains specs and run
# every credential-free test layer on each push / PR; the live smoke suite
# runs only where the GoDaddy secrets are configured; a scheduled spec-drift
# job diffs the published specs against the pin (GoDaddy revises the specs
# in place - drift is expected and must be reviewed, never silent).

on:
  push:
    branches: [main, 'feature/**']
    paths-ignore: ['website/**']
  pull_request:
    branches: [main]
    paths-ignore: ['website/**']
  schedule:
    - cron: '23 3 * * 1'   # weekly spec-drift check (Monday 03:23 UTC)
  workflow_dispatch:

jobs:
  build-and-test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # puts the latest stackql on PATH; bin/start-server.sh and the test
      # runners resolve it from there
      - name: Install stackql
        uses: stackql/setup-stackql@v2

      - name: stackql version
        run: stackql --version

      # Drift is reported, not fatal, here: the committed pin is what gets
      # built and tested. The spec-drift job below opens the review issue.
      - name: Verify the pinned specs against upstream (warns on drift)
        run: |
          if ! make fetch-spec; then
            echo "::warning title=GoDaddy spec drift::A published Domains spec no longer matches provider-dev/config/spec_pin.json - run 'make refresh-spec && make build && make test' and review the diff. Building from the committed pin."
          fi

      - name: Build provider from the pinned specs
        run: make split mappings normalize generate

      # fetch-spec refreshes the "fetched" date in spec_pin.json on every run,
      # so the pin is excluded here; pin drift is reported by the step above
      # and by the spec-drift job.
      - name: Fail on uncommitted generation drift
        run: |
          git add -N .
          if ! git diff --quiet -- provider-dev/openapi provider-dev/config provider-dev/source ':(exclude)provider-dev/config/spec_pin.json'; then
            echo "Generated output differs from the committed artifacts - run 'make build' and commit."
            git diff --stat -- provider-dev/openapi provider-dev/config provider-dev/source ':(exclude)provider-dev/config/spec_pin.json'
            exit 1
          fi

      - name: Offline validation
        run: make test-offline

      - name: Integration tests (mock GoDaddy API)
        run: make test-integration

      - name: Meta-route tests
        run: make test-meta

      - name: Generate docs (sanity - the site build runs on the web workflows)
        run: make docs

  smoke:
    # secret-gated live smoke suite against the test domains; skipped with a
    # notice when the secrets are not configured (forks, PRs from outside).
    # Serial pacing under the 60 requests/minute limit is built into the
    # harness. Nothing in the suite is billable.
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name != 'pull_request' && github.event_name != 'schedule'
    env:
      GODADDY_API_KEY: ${{ secrets.GODADDY_API_KEY }}
      GODADDY_CUSTOMER_ID: ${{ secrets.GODADDY_CUSTOMER_ID }}
      GODADDY_SMOKE_DOMAINS: ${{ vars.GODADDY_SMOKE_DOMAINS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Live smoke suite (reads + DNS record lifecycles + domain settings)
        if: env.GODADDY_API_KEY != ''
        run: make smoke

      - name: Live smoke skipped (no credentials)
        if: env.GODADDY_API_KEY == ''
        run: |
          echo "::notice title=Live smoke suite skipped::The GODADDY_API_KEY secret is not configured - the live smoke suite did not run. Credential-free coverage still ran via the mock-server integration suite."

  spec-drift:
    # Diff the published specs against the pin on a schedule and on demand,
    # and open an issue when they move.
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compare the published specs with the pin
        id: drift
        run: |
          if make fetch-spec > drift.log 2>&1; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
          fi
          cat drift.log

      - name: Open a spec-drift issue
        if: steps.drift.outputs.drift == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('drift.log', 'utf8');
            const title = 'GoDaddy Domains spec drift detected';
            const { data: open } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'spec-drift' });
            const body = `A published GoDaddy Domains spec no longer matches \`provider-dev/config/spec_pin.json\`.\n\nRun \`make refresh-spec && make build && make test\`, review the diff, and commit.\n\n<details><summary>fetch-spec output</summary>\n\n\`\`\`\n${log.slice(0, 6000)}\n\`\`\`\n</details>`;
            if (open.length > 0) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: open[0].number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['spec-drift'] });
            }
